<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <!-- Red background -->
  <rect width="320" height="100" rx="6" fill="#CC0000"/>

  <!-- SIB brand mark (diagonal stripe pattern, top-left) -->
  <g clip-path="url(#mark-clip)">
    <clipPath id="mark-clip">
      <rect x="8" y="6" width="56" height="88" rx="4"/>
    </clipPath>
    <!-- Diagonal white stripes forming the SIB abstract mark -->
    <line x1="8"  y1="6"  x2="64" y2="62" stroke="white" stroke-width="7" stroke-linecap="round"/>
    <line x1="8"  y1="18" x2="64" y2="74" stroke="white" stroke-width="7" stroke-linecap="round"/>
    <line x1="8"  y1="30" x2="64" y2="86" stroke="white" stroke-width="7" stroke-linecap="round"/>
    <line x1="8"  y1="42" x2="52" y2="86" stroke="white" stroke-width="7" stroke-linecap="round"/>
    <line x1="8"  y1="54" x2="40" y2="86" stroke="white" stroke-width="7" stroke-linecap="round"/>
    <line x1="8"  y1="66" x2="28" y2="86" stroke="white" stroke-width="7" stroke-linecap="round"/>
    <line x1="20" y1="6"  x2="64" y2="50" stroke="white" stroke-width="7" stroke-linecap="round"/>
    <line x1="32" y1="6"  x2="64" y2="38" stroke="white" stroke-width="7" stroke-linecap="round"/>
    <line x1="44" y1="6"  x2="64" y2="26" stroke="white" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- SOUTH -->
  <text x="78" y="38" font-family="Arial Black, Arial, sans-serif" font-size="22" font-weight="900" fill="white" letter-spacing="2">SOUTH</text>
  <!-- INDIAN -->
  <text x="78" y="64" font-family="Arial Black, Arial, sans-serif" font-size="22" font-weight="900" fill="white" letter-spacing="2">INDIAN</text>
  <!-- Bank -->
  <text x="78" y="86" font-family="Arial, sans-serif" font-size="18" fill="white" letter-spacing="0.5"><tspan font-weight="900">Ban</tspan><tspan font-style="italic" font-weight="400">k</tspan></text>

  <!-- Tagline -->
  <text x="160" y="94" font-family="Arial, sans-serif" font-size="8.5" fill="rgba(255,255,255,0.9)" text-anchor="middle" letter-spacing="0.3">Experience Next Generation Banking</text>
</svg>
