<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 60" width="160" height="60">
  <!-- Red background pill -->
  <rect width="160" height="60" rx="8" fill="#CC0000"/>
  <!-- Diagonal stripes top-left (white) -->
  <clipPath id="c"><rect width="160" height="60" rx="8"/></clipPath>
  <g clip-path="url(#c)" opacity="0.25">
    <line x1="-10" y1="0" x2="30" y2="60" stroke="white" stroke-width="6"/>
    <line x1="10" y1="0" x2="50" y2="60" stroke="white" stroke-width="6"/>
    <line x1="30" y1="0" x2="70" y2="60" stroke="white" stroke-width="6"/>
  </g>
  <!-- SOUTH INDIAN Bank text -->
  <text x="80" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="800" fill="white" text-anchor="middle" letter-spacing="1">SOUTH INDIAN</text>
  <text x="80" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="white" text-anchor="middle" letter-spacing="0.5"><tspan font-weight="700">Bank</tspan></text>
  <text x="80" y="53" font-family="Arial, sans-serif" font-size="6.5" fill="rgba(255,255,255,0.85)" text-anchor="middle" letter-spacing="0.3">Experience Next Generation Banking</text>
</svg>
